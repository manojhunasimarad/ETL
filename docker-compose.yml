# Local stack. Start what a step needs:
#   docker compose up -d postgres            # step 2+
#   docker compose --profile tools up -d     # + pgAdmin on http://localhost:5050
#   docker compose --profile dashboard up -d # + Streamlit dashboard on http://localhost:8501
#   docker compose --profile airflow up -d   # + Airflow on http://localhost:8080
#   docker compose --profile streaming up -d # + Kafka on localhost:9092 (step 9)
name: ecom-etl

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${ECOM_DB_USER:-ecom}
      POSTGRES_PASSWORD: ${ECOM_DB_PASSWORD:-ecom}
      POSTGRES_DB: ${ECOM_DB_NAME:-ecom}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ECOM_DB_USER:-ecom} -d ${ECOM_DB_NAME:-ecom}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs any pipeline command with Java + Spark preinstalled, e.g.
  #   docker compose run --rm pipeline bronze --source synthetic
  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ecom-etl/pipeline:latest
    profiles: ["pipeline"]
    environment:
      ECOM_DB_HOST: postgres
      ECOM_KAFKA_BOOTSTRAP: kafka:29092
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./src:/app/src          # code changes apply without rebuilding
    depends_on:
      postgres:
        condition: service_healthy

  # Streamlit dashboard on http://localhost:8501
  #   docker compose --profile dashboard up -d dashboard
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ecom-etl/pipeline:latest
    profiles: ["dashboard"]
    entrypoint: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      ECOM_DB_HOST: postgres
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/app/dashboard
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy

  # Airflow 3 (UI on http://localhost:8080, no login in local mode)
  #   docker compose --profile airflow up -d airflow
  # On Linux, set AIRFLOW_UID=$(id -u) in .env so files in ./data stay yours.
  airflow:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    image: ecom-etl/airflow:latest
    profiles: ["airflow"]
    user: "${AIRFLOW_UID:-50000}:0"
    command: ["bash", "/opt/airflow/start.sh"]
    environment:
      ECOM_DB_HOST: postgres
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${ECOM_DB_USER:-ecom}:${ECOM_DB_PASSWORD:-ecom}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      # the image's entrypoint waits for the metadata DB before running any
      # command; skip that so start.sh can create the "airflow" database first
      CONNECTION_CHECK_MAX_COUNT: "0"
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./docker/airflow-start.sh:/opt/airflow/start.sh:ro
      - ./data:/opt/ecom/data
      - ./reports:/opt/ecom/reports
      - ./src:/opt/ecom/src
    depends_on:
      postgres:
        condition: service_healthy

  # Kafka 4 in KRaft mode (no ZooKeeper), step 9:
  #   docker compose --profile streaming up -d kafka
  # Your laptop connects to localhost:9092, other containers to kafka:29092.
  kafka:
    image: apache/kafka:4.1.2
    profiles: ["streaming"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://localhost:9093,PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  pgadmin:
    image: dpage/pgadmin4:9
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
