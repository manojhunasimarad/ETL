name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecom
          POSTGRES_PASSWORD: ecom
          POSTGRES_DB: ecom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecom -d ecom"
          --health-interval 5s --health-timeout 5s --health-retries 20
      kafka:
        image: apache/kafka:4.1.2
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-timeout 10s --health-retries 30
    env:
      ECOM_DB_HOST: localhost
      ECOM_KAFKA_BOOTSTRAP: localhost:9092
      # services listed here must be available, otherwise the run fails
      ECOM_REQUIRE_INFRA: postgres,spark,kafka
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Use Java 17 (preinstalled on the runner)
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          "$JAVA_HOME_17_X64/bin/java" -version
      - name: Install
        run: pip install -e ".[dev,postgres,spark,dashboard,streaming]"
      - name: Tests (unit + integration)
        run: pytest -q -rs
      - name: Smoke run
        run: |
          python -m ecom_etl generate --orders 5000
          python -m ecom_etl profile --source synthetic
          python -m ecom_etl load-raw --source synthetic
          python -m ecom_etl build-core --source synthetic
          python -m ecom_etl bronze --source synthetic
          python -m ecom_etl silver --source synthetic
          python -m ecom_etl gold --source synthetic
          python -m ecom_etl load-gold --source synthetic
          python -m ecom_etl quality --source synthetic
          python -m ecom_etl generate --orders 20000 --out data/raw/synthetic
          python -m ecom_etl run --source synthetic
          cat reports/dq_report_synthetic.md
          python -m ecom_etl analyze --source synthetic
          python -m ecom_etl produce --source synthetic --limit 3000
          python -m ecom_etl stream --source synthetic --reset

  airflow:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecom
          POSTGRES_PASSWORD: ecom
          POSTGRES_DB: ecom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecom -d ecom"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ECOM_DB_HOST: localhost
      AIRFLOW_VERSION: "3.1.7"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Use Java 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - name: Install Airflow (with its constraints) and the project
        run: |
          pip install "apache-airflow==${AIRFLOW_VERSION}" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-3.11.txt"
          pip install "apache-airflow==${AIRFLOW_VERSION}" -e ".[dev,postgres,spark]"
      - name: DAG structure tests
        run: pytest -q tests/test_airflow_dag.py
      - name: Run the whole DAG once (airflow dags test)
        env:
          ECOM_HOME: ${{ github.workspace }}
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/airflow/dags
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        run: |
          airflow db migrate
          airflow dags test ecom_batch_pipeline --conf '{"source": "synthetic", "orders": 3000}'
          ls reports/

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate docker-compose.yml
        run: docker compose --profile tools config --quiet
      - name: Pull images
        run: docker compose --profile tools pull --quiet
      - name: Build the pipeline image
        run: docker compose --profile pipeline build pipeline
      - name: Run the pipeline in Docker
        run: |
          mkdir -p data reports
          docker compose up -d postgres
          docker compose run --rm pipeline generate --orders 2000
          docker compose run --rm pipeline bronze --source synthetic
          docker compose run --rm pipeline silver --source synthetic
          docker compose run --rm pipeline gold --source synthetic
          docker compose run --rm pipeline load-gold --source synthetic
          docker compose run --rm pipeline run --source synthetic
      - name: Airflow starts in Docker
        run: |
          sudo chmod -R 777 data reports
          docker compose --profile airflow build airflow
          docker compose --profile airflow up -d airflow
          for i in $(seq 1 60); do curl -fs http://localhost:8080/api/v2/monitor/health && break; sleep 5; done
          if ! curl -fs http://localhost:8080/api/v2/monitor/health; then
            docker compose --profile airflow ps -a
            docker compose --profile airflow logs airflow | head -80
            docker compose --profile airflow logs airflow | tail -80
            exit 1
          fi
          docker compose --profile airflow exec -T airflow airflow dags list
      - name: Streaming in Docker (Kafka + Spark Structured Streaming)
        run: |
          docker compose --profile streaming up -d --wait kafka
          docker compose run --rm pipeline produce --source synthetic --limit 1000
          docker compose run --rm pipeline stream --source synthetic --reset
      - name: Dashboard serves in Docker
        run: |
          docker compose --profile dashboard up -d dashboard
          for i in $(seq 1 30); do curl -fs http://localhost:8501/_stcore/health && break; sleep 2; done
          curl -fs http://localhost:8501/_stcore/health
          docker compose --profile dashboard logs dashboard | tail -20
