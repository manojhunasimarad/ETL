name: benchmark

# Heavy: run by hand (Actions tab > benchmark > Run workflow) or on the tuning branch.
on:
  workflow_dispatch:
    inputs:
      orders:
        description: "number of synthetic orders"
        default: "200000"
      repeat:
        description: "runs per Spark configuration"
        default: "2"
  push:
    branches: ["step-07-*"]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecom
          POSTGRES_PASSWORD: ecom
          POSTGRES_DB: ecom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecom -d ecom"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ECOM_DB_HOST: localhost
      ECOM_SPARK_DRIVER_MEMORY: 8g
      ORDERS: ${{ github.event.inputs.orders || '200000' }}
      REPEAT: ${{ github.event.inputs.repeat || '2' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Use Java 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - name: Install
        run: pip install -e ".[postgres,spark]"
      - name: Generate data
        run: python -m ecom_etl generate --orders "$ORDERS"
      - name: Benchmark
        run: python -m ecom_etl benchmark --source synthetic --repeat "$REPEAT"
      - name: Summary
        run: cat reports/benchmark_synthetic.md >> "$GITHUB_STEP_SUMMARY"
